<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Click & Collect PWA</title>
  <meta name="theme-color" content="#020617">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
   window.tailwind = window.tailwind || {}; window.tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#10b981', 600: '#059669', 700: '#047857' };}
        }
      }
    }
  </script>
  <style>
    /* Custom Scrollbar & Glassmorphism */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.5);
    }
    .glass-nav {
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
  </style>
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./icon.png">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-brand-500 selection:text-white pb-28">

  <!-- EN-TÊTE FIXE -->
  <header class="sticky top-0 z-30 glass-nav border-b border-slate-800/80 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-xl bg-brand-500/20 border border-brand-500/40 flex items-center justify-center text-brand-500 font-bold text-lg" id="shopLogo">
        🛍️
      </div>
      <div>
        <h1 class="font-bold text-base text-slate-100 leading-tight" id="shopName">Chargement...</h1>
        <p class="text-xs text-slate-400 flex items-center space-x-1">
          <span class="w-2 h-2 rounded-full bg-brand-500 animate-pulse"></span>
          <span>Click & Collect</span>
        </p>
      </div>
    </div>
    <button onclick="toggleAdminModal()" class="p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-white active:scale-95 transition-all text-xs flex items-center space-x-1">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      <span>Admin</span>
    </button>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4">

    <!-- BANNIÈRE D'ACCROCHE -->
    <div class="glass-card rounded-2xl p-3.5 mb-5 border-emerald-500/20 bg-emerald-950/10 flex items-start space-x-3">
      <span class="text-xl">📍</span>
      <div class="text-xs text-slate-300 space-y-0.5">
        <p class="font-medium text-slate-200" id="shopAddress">Adresse non configurée</p>
        <p class="text-slate-400" id="shopTagline">Commandez et retirez directement en boutique.</p>
      </div>
    </div>

    <!-- BARRE DE CATÉGORIES -->
    <div class="flex items-center space-x-2 overflow-x-auto pb-3 mb-4 no-scrollbar" id="categoriesBar">
      <!-- Généré dynamiquement -->
    </div>

    <!-- GRILLE DE PRODUITS -->
    <div class="space-y-3" id="productsGrid">
      <!-- Généré dynamiquement -->
    </div>
  </main>

  <!-- BARRE FLOTTANTE DU PANIER (Pied de page) -->
  <div class="fixed bottom-0 left-0 right-0 z-20 glass-nav border-t border-slate-800 p-4" id="cartBar">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <p class="text-xs text-slate-400">Total panier</p>
        <p class="text-lg font-bold text-emerald-400" id="cartTotalDisplay">0,00 €</p>
      </div>
      <button onclick="toggleCartModal()" id="cartBtn" disabled class="bg-brand-600 disabled:bg-slate-800 disabled:text-slate-500 text-white font-medium px-5 py-2.5 rounded-xl transition-all active:scale-95 flex items-center space-x-2 text-sm">
        <span>Voir le panier</span>
        <span class="bg-white/20 text-white px-2 py-0.5 rounded-full text-xs font-bold" id="cartCountBadge">0</span>
      </button>
    </div>
  </div>

  <!-- MODAL PANIER & ENVOI WHATSAPP -->
  <div id="cartModal" class="fixed inset-0 z-40 bg-black/70 backdrop-blur-sm hidden flex items-end justify-center">
    <div class="bg-slate-900 border-t border-slate-800 w-full max-w-md rounded-t-3xl max-h-[85vh] flex flex-col overflow-hidden animate-slide-up">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between">
        <h2 class="font-bold text-slate-100 flex items-center space-x-2">
          <span>🛒</span>
          <span>Votre Commande</span>
        </h2>
        <button onclick="toggleCartModal()" class="text-slate-400 hover:text-white p-1">✕</button>
      </div>

      <div class="p-4 overflow-y-auto space-y-3 flex-1" id="cartItemsList">
        <!-- Articles du panier -->
      </div>

      <div class="p-4 border-t border-slate-800 space-y-3 bg-slate-950/50">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Votre Nom / Prénom *</label>
          <input type="text" id="customerName" placeholder="Ex: Karim Benz" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Heure de retrait souhaitée</label>
          <input type="text" id="pickupTime" placeholder="Ex: Aujourd'hui à 18h30" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-brand-500">
        </div>
        <button onclick="sendOrderToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl transition-all active:scale-95 flex items-center justify-center space-x-2 text-sm shadow-lg shadow-emerald-950">
          <span>Envoyer sur WhatsApp</span>
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></button>
      </div>
    </div>
  </div>

  <!-- MODAL ADMIN / ÉDITEUR JSON -->
  <div id="adminModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl max-h-[90vh] flex flex-col overflow-hidden">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-950">
        <h2 class="font-bold text-slate-100 flex items-center space-x-2">
          <span>⚙️</span>
          <span>Éditeur de Catalogue JSON</span>
        </h2>
        <button onclick="toggleAdminModal()" class="text-slate-400 hover:text-white">✕</button>
      </div>

      <div class="p-4 overflow-y-auto space-y-4 text-xs">
        <!-- IMPORT / EXPORT -->
        <div class="grid grid-cols-2 gap-2 p-3 bg-slate-950 rounded-xl border border-slate-800">
          <div>
            <label class="block text-slate-400 mb-1 font-medium">Importer un JSON</label>
            <input type="file" id="jsonFileInput" accept=".json" onchange="importJSONFile(event)" class="text-xs text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:bg-slate-800 file:text-slate-200">
          </div>
          <div class="flex flex-col justify-end">
            <button onclick="exportJSONFile()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 py-1.5 px-3 rounded-lg border border-slate-700 font-medium transition-all">
              📥 Exporter data.json
            </button>
          </div>
        </div>

        <!-- FORMULAIRE CONFIG BOUTIQUE -->
        <div class="space-y-2 border-t border-slate-800 pt-3">
          <h3 class="font-bold text-brand-500 uppercase tracking-wider">Infos Boutique</h3>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-slate-400 mb-1">Nom du commerce</label>
              <input type="text" id="editShopName" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-100">
            </div>
            <div>
              <label class="block text-slate-400 mb-1">Téléphone WhatsApp</label>
              <input type="text" id="editShopPhone" placeholder="33612345678" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-100">
            </div>
            <div>
              <label class="block text-slate-400 mb-1">Devise</label>
              <input type="text" id="editShopCurrency" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-100">
            </div>
            <div>
              <label class="block text-slate-400 mb-1">Adresse</label>
              <input type="text" id="editShopAddress" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-100">
            </div>
          </div>
        </div>

        <!-- AJOUT DE PRODUIT -->
        <div class="space-y-2 border-t border-slate-800 pt-3">
          <h3 class="font-bold text-brand-500 uppercase tracking-wider">Ajouter un produit</h3>
          <div class="grid grid-cols-2 gap-2">
            <input type="text" id="newProdName" placeholder="Nom du produit" class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-100">
            <input type="number" step="0.01" id="newProdPrice" placeholder="Prix" class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-100">
            <input type="text" id="newProdUnit" placeholder="Unité (ex: le kg, la pièce)" class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-100">
            <input type="text" id="newProdCategory" placeholder="Catégorie" class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-slate-100">
          </div>
          <button onclick="addNewProductFromAdmin()" class="w-full bg-brand-600 hover:bg-brand-500 text-white py-2 rounded-lg font-bold">
            + Ajouter au catalogue
          </button>
        </div>

        <!-- LISTE DES PRODUITS EXISTANTS -->
        <div class="border-t border-slate-800 pt-3">
          <h3 class="font-bold text-slate-300 mb-2">Produits actuels (<span id="adminProdCount">0</span>)</h3>
          <div class="space-y-2 max-h-40 overflow-y-auto" id="adminProductsList">
            <!-- Liste dynamique -->
          </div>
        </div>
      </div>

      <div class="p-3 border-t border-slate-800 bg-slate-950 flex justify-end">
        <button onclick="saveAdminChanges()" class="bg-emerald-600 text-white font-bold px-4 py-2 rounded-xl text-xs">
          Enregistrer & Appliquer
        </button>
      </div>
    </div>
  </div>

  <!-- NOTIFICATION TOAST FLOTTANTE -->
  <div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-slate-800/90 border border-slate-700 text-slate-200 px-4 py-2 rounded-xl text-xs backdrop-blur-md shadow-2xl transition-all duration-300 opacity-0 pointer-events-none">
    Message Toast
  </div>

  <script>
    // --- DONNÉES DE SECOURS (DÉMO) ---
    const DEFAULT_DATA = {
      boutique: {
        nom: "Épicerie Bio du Coin",
        telephoneWhatsApp: "33612345678",
        devise: "€",
        adresse: "14 Rue du Commerce, Paris",
        messageAccroche: "Produits frais & locaux à récupérer en boutique !"
      },
      categories: ["Tous", "Fruits & Légumes", "Boissons", "Frais"],
      produits: [
        { id: "p1", categorie: "Fruits & Légumes", nom: "Pommes Gala Bio", prix: 2.99, unite: "le kg", disponible: true, image: "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=200" },
        { id: "p2", categorie: "Boissons", nom: "Jus d'Orange Pressé 1L", prix: 3.50, unite: "la bouteille", disponible: true, image: "https://images.unsplash.com/photo-1621506289937-a8e4df240d0b?w=200" },
        { id: "p3", categorie: "Frais", nom: "Fromage de Chèvre", prix: 4.20, unite: "la pièce", disponible: true, image: "https://images.unsplash.com/photo-1452195100486-9cc805987862?w=200" }
      ]
    };

    // --- ÉTAT DE L'APPLICATION ---
    let storeData = { ...DEFAULT_DATA };
    let cart = [];
    let activeCategory = "Tous";

    // --- INITIALISATION ---
    document.addEventListener("DOMContentLoaded", async () => {
      await loadCatalogData();
      renderApp();
    });

    // Chargement dynamique du data.json avec anti-cache
    async function loadCatalogData() {
      try {
        const response = await fetch('./data.json?v=' + Date.now());
        if (response.ok) {
          storeData = await response.json();
          showToast("Catalogue data.json chargé");
        } else {
          showToast("data.json non trouvé - Mode Démo");
        }
      } catch (err) {
        showToast("Mode démonstration actif");
      }
    }

    // --- RENDU DE L'INTERFACE ---
    function renderApp() {
      // Infos Boutique
      document.getElementById('shopName').innerText = storeData.boutique.nom;
      document.getElementById('shopAddress').innerText = storeData.boutique.adresse;
      document.getElementById('shopTagline').innerText = storeData.boutique.messageAccroche;

      // Catégories
      const categoriesBar = document.getElementById('categoriesBar');
      categoriesBar.innerHTML = storeData.categories.map(cat => `
        <button onclick="setCategory('${cat}')" class="px-3.5 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition-all ${
          activeCategory === cat 
            ? 'bg-brand-500 text-white shadow-lg shadow-brand-500/20' 
            : 'bg-slate-900 border border-slate-800 text-slate-400 hover:text-slate-200'
        }">
          ${cat}
        </button>
      `).join('');

      // Produits
      const productsGrid = document.getElementById('productsGrid');
      const filtered = activeCategory === "Tous" 
        ? storeData.produits 
        : storeData.produits.filter(p => p.categorie === activeCategory);

      productsGrid.innerHTML = filtered.map(p => {
        const cartItem = cart.find(item => item.id === p.id);
        const qty = cartItem ? cartItem.quantite : 0;

        return `
          <div class="glass-card rounded-2xl p-3 flex items-center space-x-3 border border-slate-800/80">
            <img src="${p.image || 'https://via.placeholder.com/150'}" alt="${p.nom}" class="w-16 h-16 rounded-xl object-cover bg-slate-800">
            <div class="flex-1 min-w-0">
              <h3 class="text-sm font-semibold text-slate-100 truncate">${p.nom}</h3>
              <p class="text-xs text-slate-400">${p.prix.toFixed(2)} ${storeData.boutique.devise} / ${p.unite}</p>
            </div>
            <div class="flex items-center space-x-2 bg-slate-950 p-1 rounded-xl border border-slate-800">
              ${qty > 0 ? `
                <button onclick="updateCart('${p.id}', -1)" class="w-7 h-7 bg-slate-800 text-slate-200 rounded-lg flex items-center justify-center font-bold text-sm active:scale-90 transition-transform">-</button>
                <span class="text-xs font-bold text-brand-500 px-1">${qty}</span>
              ` : ''}
              <button onclick="updateCart('${p.id}', 1)" class="w-7 h-7 bg-brand-600 text-white rounded-lg flex items-center justify-center font-bold text-sm active:scale-90 transition-transform">+</button>
            </div>
          </div>
        `;
      }).join('');

      updateCartBar();
    }

    // --- GESTION DU PANIER ---
    function updateCart(productId, delta) {
      vibrate();
      const product = storeData.produits.find(p => p.id === productId);
      if (!product) return;

      const itemIndex = cart.findIndex(item => item.id === productId);
      if (itemIndex > -1) {
        cart[itemIndex].quantite += delta;
        if (cart[itemIndex].quantite <= 0) cart.splice(itemIndex, 1);
      } else if (delta > 0) {
        cart.push({ ...product, quantite: 1 });
      }

      renderApp();
    }

    function setCategory(cat) {
      vibrate();
      activeCategory = cat;
      renderApp();
    }

    function updateCartBar() {
      const totalCount = cart.reduce((acc, item) => acc + item.quantite, 0);
      const totalPrice = cart.reduce((acc, item) => acc + (item.prix * item.quantite), 0);

      document.getElementById('cartTotalDisplay').innerText = `${totalPrice.toFixed(2)} ${storeData.boutique.devise}`;
      document.getElementById('cartCountBadge').innerText = totalCount;
      document.getElementById('cartBtn').disabled = totalCount === 0;
    }

    // --- MODALES & ENVOI WHATSAPP ---
    function toggleCartModal() {
      vibrate();
      const modal = document.getElementById('cartModal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) renderCartItems();
    }

    function renderCartItems() {
      const cartItemsList = document.getElementById('cartItemsList');
      if (cart.length === 0) {
        cartItemsList.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">Votre panier est vide.</p>`;
        return;
      }

      cartItemsList.innerHTML = cart.map(item => `
        <div class="flex items-center justify-between bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-xs">
          <div>
            <p class="font-semibold text-slate-200">${item.nom}</p>
            <p class="text-slate-400">${item.quantite} x ${item.prix.toFixed(2)} ${storeData.boutique.devise}</p>
          </div>
          <span class="font-bold text-emerald-400">${(item.quantite * item.prix).toFixed(2)} ${storeData.boutique.devise}</span>
        </div>
      `).join('');
    }

    function sendOrderToWhatsApp() {
      vibrate();
      const customerName = document.getElementById('customerName').value.trim();
      const pickupTime = document.getElementById('pickupTime').value.trim();

      if (!customerName) {
        showToast("Veuillez saisir votre nom !");
        return;
      }

      const total = cart.reduce((acc, item) => acc + (item.prix * item.quantite), 0).toFixed(2);
      
      let msg = `🛍️ *NOUVELLE COMMANDE CLICK & COLLECT*\n`;
      msg += `👤 Client : *${customerName}*\n`;
      if (pickupTime) msg += `🕒 Retrait : *${pickupTime}*\n`;
      msg += `-----------------------------------\n\n`;

      cart.forEach(item => {
        msg += `▪️ ${item.quantite}x ${item.nom} (${(item.prix * item.quantite).toFixed(2)} ${storeData.boutique.devise})\n`;
      });

      msg += `\n💰 *TOTAL À PAYER : ${total} ${storeData.boutique.devise}*`;

      const phone = storeData.boutique.telephoneWhatsApp.replace(/[^0-9]/g, '');
      const url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
      
      window.open(url, '_blank');
    }

    // --- ADMINISTRATION & GESTION JSON ---
    function toggleAdminModal() {
      vibrate();
      const modal = document.getElementById('adminModal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) populateAdminForm();
    }

    function populateAdminForm() {
      document.getElementById('editShopName').value = storeData.boutique.nom;
      document.getElementById('editShopPhone').value = storeData.boutique.telephoneWhatsApp;
      document.getElementById('editShopCurrency').value = storeData.boutique.devise;
      document.getElementById('editShopAddress').value = storeData.boutique.adresse;

      document.getElementById('adminProdCount').innerText = storeData.produits.length;
      const list = document.getElementById('adminProductsList');
      list.innerHTML = storeData.produits.map((p, idx) => `
        <div class="flex items-center justify-between bg-slate-950 p-2 rounded-lg border border-slate-800 text-xs">
          <span class="truncate max-w-[200px] text-slate-300">${p.nom} (${p.prix} ${storeData.boutique.devise})</span>
          <button onclick="removeProductFromAdmin(${idx})" class="text-rose-400 hover:text-rose-300">Supprimer</button>
        </div>
      `).join('');
    }

    function addNewProductFromAdmin() {
      const nom = document.getElementById('newProdName').value.trim();
      const prix = parseFloat(document.getElementById('newProdPrice').value);
      const unite = document.getElementById('newProdUnit').value.trim() || 'pièce';
      const cat = document.getElementById('newProdCategory').value.trim() || 'Divers';

      if (!nom || isNaN(prix)) {
        showToast("Saisissez un nom et un prix valide !");
        return;
      }

      const newProd = {
        id: "p_" + Date.now(),
        categorie: cat,
        nom: nom,
        prix: prix,
        unite: unite,
        disponible: true,
        image: ""
      };

      storeData.produits.push(newProd);
      if (!storeData.categories.includes(cat)) storeData.categories.push(cat);

      // Reset inputs
      document.getElementById('newProdName').value = '';
      document.getElementById('newProdPrice').value = '';
      
      populateAdminForm();
      showToast("Produit ajouté !");
    }

    function removeProductFromAdmin(index) {
      storeData.produits.splice(index, 1);
      populateAdminForm();
    }

    function saveAdminChanges() {
      storeData.boutique.nom = document.getElementById('editShopName').value;
      storeData.boutique.telephoneWhatsApp = document.getElementById('editShopPhone').value;
      storeData.boutique.devise = document.getElementById('editShopCurrency').value;
      storeData.boutique.adresse = document.getElementById('editShopAddress').value;

      renderApp();
      toggleAdminModal();
      showToast("Modifications appliquées !");
    }

    function exportJSONFile() {
      saveAdminChanges();
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(storeData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "data.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast("Fichier data.json exporté");
    }

    function importJSONFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          storeData = JSON.parse(e.target.result);
          populateAdminForm();
          renderApp();
          showToast("Nouveau JSON chargé avec succès !");
        } catch (err) {
          showToast("Erreur : Fichier JSON invalide !");
        }
      };
      reader.readAsText(file);
    }

    // --- UTILS ---
    function vibrate() {
      if (navigator.vibrate) navigator.vibrate(40);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }
  </script>
<script>
if ('serviceWorker' in navigator) {
window.addEventListener('load',()=>{
navigator.serviceWorker.register('./sw.js').catch(err=>console.error(err));
});
}
</script>
</body>
</html>
